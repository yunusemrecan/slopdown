name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    name: Parser tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --filter SlopdownCoreTests

  build:
    name: Build Slopdown.app (Apple Silicon)
    runs-on: macos-15
    permissions:
      contents: write   # publish nightly / tagged releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Tests
        run: swift test

      - name: Build app bundle
        run: |
          VERSION="0.1.0+$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          SLOPDOWN_VERSION="$VERSION" scripts/build_app.sh --arch arm64

      - name: Launch check (opens the sample note, takes a screenshot)
        run: |
          set +e
          open -a "$PWD/dist/Slopdown.app" "$PWD/Samples/Welcome.md"
          sleep 8
          mkdir -p screenshots
          screencapture -x screenshots/welcome.png
          pgrep -x Slopdown >/dev/null || { echo "App is not running"; exit 1; }
          pkill -x Slopdown
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Slopdown-macos-arm64
          path: dist/Slopdown-macos-arm64.zip

      - name: Publish rolling "nightly" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/Slopdown-macos-arm64.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes "Latest \`main\` build. Unsigned: right-click → Open, or \`xattr -dr com.apple.quarantine Slopdown.app\`."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/Slopdown-macos-arm64.zip --generate-notes
